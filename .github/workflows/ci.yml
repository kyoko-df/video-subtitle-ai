name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew list ffmpeg || brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Verify media tools
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Install project and test dependencies
        run: python -m pip install -e ".[all,dev]"
      - name: Python lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Python tests
        run: pytest -q --cov=shengmu --cov-report=term-missing --cov-fail-under=80 -W error
      - name: JavaScript tests and syntax
        run: |
          node --test tests/test_editor.cjs
          node --check src/shengmu/web/app.js
          node --check src/shengmu/web/editor.js
          node --check src/shengmu/web/studio.js
      - name: Build distribution
        run: python -m build
